<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="甜呱工作台">
<meta name="theme-color" content="#F48FB1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
<link rel="apple-touch-icon" sizes="60x60" href="icon-60.png">
<title>甜呱工作台 · 小猪嘟嘟</title>
<style>
/* ============ 可爱小猪主题 ============ */
:root{
  --pig-pink:#FFD6E0; --pig-body:#FFE0D0; --pig-accent:#FF9B9B; --pig-dark:#E57373;
  --cream:#FFF9F5; --mint:#C8E6C9; --mint-d:#81C784;
  --purple:#E1BEE7; --purple-d:#BA68C8;
  --yellow:#FFF3C4; --yellow-d:#FFD54F;
  --blue:#BBDEFB; --blue-d:#64B5F6;
  --ink:#5D4037; --ink-soft:#8D6E63; --ink-light:#BCAAA4;
  --line:#FFD6E0; --card:#FFFFFF; --shadow:0 4px 14px rgba(255,155,155,.2);
  --shadow-lg:0 8px 24px rgba(255,155,155,.28);
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla";
  background:linear-gradient(135deg,#FFF0E6 0%,#FFF9F5 40%,#FFE8D6 100%);
  background-attachment:fixed;color:var(--ink);min-height:100vh;
  font-size:15px;line-height:1.6;
}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--pig-dark);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--pig-pink);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* 像素分隔线 */
.pixel-line{height:3px;background:repeating-linear-gradient(90deg,var(--pig-pink) 0 6px,transparent 6px 12px);margin:12px 0;border-radius:2px}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,#FFF9F5 0%,#FFF0E6 100%);
  border-right:2px dashed var(--pig-body);padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:2px dotted var(--pig-body);margin-bottom:10px}
.brand .logo{font-size:30px;filter:drop-shadow(0 2px 0 var(--pig-accent))}
.brand .title{font-size:18px;font-weight:800;color:var(--pig-dark);line-height:1.1}
.brand .subtitle{font-size:11px;color:var(--ink-soft);letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);
  color:var(--ink);font-weight:600;font-size:14px;transition:all .18s;text-align:left;width:100%;
}
.nav-item .ico{font-size:18px;width:24px;text-align:center}
.nav-item:hover{background:rgba(255,224,208,.45)}
.nav-item.active{background:linear-gradient(90deg,var(--pig-body),var(--pig-accent));color:#fff;box-shadow:var(--shadow)}
.nav-item.active .ico{transform:scale(1.1)}
.nav-foot{font-size:11px;color:var(--ink-light);text-align:center;padding-top:10px;border-top:2px dotted var(--pig-body);margin-top:10px}
.main{flex:1;padding:22px 26px 60px;max-width:980px;margin:0 auto;width:100%}

/* 移动端顶栏 */
.mobile-bar{display:none;position:sticky;top:0;z-index:60;
  background:linear-gradient(90deg,var(--pig-accent),var(--pig-body));
  padding:12px 16px;align-items:center;gap:12px;box-shadow:var(--shadow)}
.mobile-bar .menu-btn{font-size:22px;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:var(--shadow)}
.mobile-bar .m-title{color:#fff;font-weight:800;font-size:17px;flex:1}
.mobile-bar .m-date{color:#fff;font-size:12px;opacity:.9}

/* 抽屉遮罩 */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(93,64,55,.4);z-index:40}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.page-head h2{font-size:22px;display:flex;align-items:center;gap:8px}
.page-head .sub{font-size:12px;color:var(--ink-soft);font-weight:400}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;border:2px solid #FFF}
.card.pink{background:linear-gradient(135deg,#FFF0E6,#FFF9F5);border-color:var(--pig-body)}
.card.mint{background:linear-gradient(135deg,#E8F5E9,#FFF9F5);border-color:var(--mint)}
.card.purple{background:linear-gradient(135deg,#F3E5F5,#FFF9F5);border-color:var(--purple)}
.card.yellow{background:linear-gradient(135deg,#FFFDE7,#FFF9F5);border-color:var(--yellow-d)}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--pig-dark)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;transition:all .15s;background:var(--pig-body);color:#5D4037}
.btn:hover{background:var(--pig-accent);color:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(90deg,var(--pig-accent),var(--pig-dark));color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--pig-body);color:var(--pig-dark)}
.btn.danger{background:#FFCDD2;color:#C62828}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{width:100%;justify-content:center;padding:13px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:#FFF;border:2px solid var(--pig-body);color:var(--pig-dark)}
.icon-btn:hover{background:var(--pig-pink)}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:2px solid var(--pig-pink);border-radius:var(--radius-sm);background:#FFF;
  transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pig-accent)}
.field textarea{resize:vertical;min-height:70px}
.field.row{display:flex;gap:10px}
.field.row>*{flex:1}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:20px;background:#FFF;border:2px solid var(--pig-pink);font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .15s}
.chip.on{background:var(--pig-body);border-color:var(--pig-accent);color:#fff}
.chip:hover{border-color:var(--pig-accent)}

/* 模态框 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(93,64,55,.5);z-index:100;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:#FFF;border-radius:var(--radius);width:100%;max-width:480px;margin:auto;box-shadow:var(--shadow-lg);overflow:hidden;border:3px solid var(--pig-body)}
.modal-head{background:linear-gradient(90deg,var(--pig-accent),var(--pig-dark));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{color:#fff;font-size:17px}
.modal-body{padding:18px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:2px dashed var(--pig-pink);display:flex;gap:10px;justify-content:flex-end}

/* 列表项 */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FFF;border-radius:var(--radius-sm);margin-bottom:8px;border:2px solid #FFF8FB;transition:all .15s}
.list-item:hover{border-color:var(--pig-body);box-shadow:var(--shadow)}
.list-item.done{opacity:.55}
.list-item.done .li-title{text-decoration:line-through}
.li-title{font-weight:600;flex:1}
.li-sub{font-size:12px;color:var(--ink-soft)}
.li-actions{display:flex;gap:6px}
.empty{text-align:center;padding:30px 14px;color:var(--ink-light);font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:8px}

/* 标签页 */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;background:#FFF;border:2px solid var(--pig-pink);font-weight:600;font-size:13px;color:var(--ink-soft)}
.tab.on{background:var(--pig-body);border-color:var(--pig-accent);color:#fff}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:#FFF;border-radius:var(--radius);padding:14px;text-align:center;border:2px solid #FFF;box-shadow:var(--shadow)}
.stat-card .label{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
.stat-card .num{font-size:22px;font-weight:800}
.stat-card.income .num{color:var(--mint-d)}
.stat-card.expense .num{color:var(--pig-dark)}
.stat-card.balance .num{color:var(--purple-d)}

/* 月历 */
.cal{background:#FFF;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:16px;border:2px solid #FFF}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-weight:700;font-size:16px;color:var(--pig-dark)}
.cal-nav{display:flex;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;background:#FFF8FB;border:2px solid transparent;position:relative;min-height:38px}
.cal-day:hover{border-color:var(--pig-body)}
.calday.other{opacity:.35}
.cal-day.today{background:var(--yellow);border-color:var(--yellow-d)}
.cal-day.sel{background:var(--pig-body);color:#fff;border-color:var(--pig-accent)}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--pig-accent);margin-top:2px}
.cal-day.has .dot{display:block}
.cal-day .dots{display:flex;gap:2px;height:5px;margin-top:1px}

/* 月历色点 */
.dot-schedule{background:var(--blue-d)}
.dot-period{background:var(--pig-dark)}
.dot-memo{background:var(--mint-d)}

/* 优先级标记 */
.pri{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pri-high{background:#E53935}.pri-mid{background:#FB8C00}.pri-low{background:var(--mint-d)}

/* 照片预览 */
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-sm);margin-top:8px;border:2px solid var(--pig-pink)}
.upload-area{border:2px dashed var(--pig-body);border-radius:var(--radius-sm);padding:20px;text-align:center;color:var(--ink-soft);cursor:pointer;background:#FFF8FB}
.upload-area:hover{background:var(--pig-pink)}
.upload-area .big{font-size:30px;display:block;margin-bottom:6px}

/* AI 分析提示 */
.ai-badge{display:inline-flex;align-items:center;gap:4px;background:var(--purple);color:var(--purple-d);padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.ai-loading{display:inline-flex;align-items:center;gap:6px;color:var(--purple-d);font-size:13px;font-weight:600}

/* 趋势图容器 */
.chart-box{background:#FFF;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:2px solid #FFF;margin-bottom:16px}

/* 倒计时徽章 */
.count-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.count-today{background:var(--yellow);color:#F57F17}
.count-soon{background:var(--pig-body);color:#fff}
.count-far{background:#F5F5F5;color:var(--ink-soft)}

/* 朗读/语音按钮 */
.voice-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;background:var(--mint);color:#2E7D32;font-weight:600;font-size:13px;border:2px solid var(--mint-d)}
.voice-btn.rec{background:#FFCDD2;color:#C62828;border-color:#E53935;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* 月历标记图例 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* 隐藏 */
.hidden{display:none!important}

/* 响应式 */
@media(max-width:860px){
  .app{display:block}
  .sidebar{position:fixed;left:0;top:0;width:240px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);height:100vh;z-index:50}
  .sidebar.open{transform:translateX(0);z-index:60}
  .mobile-bar{display:flex}
  .main{padding:14px 14px 80px;max-width:100%}
  .stat-grid{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat-card .num{font-size:18px}
  .row-2{grid-template-columns:1fr}
  .row-3{grid-template-columns:1fr 1fr}
  .page-head h2{font-size:19px}
  .modal{max-width:100%}
  .cal-day{font-size:11px;min-height:34px}
  .list-item{flex-wrap:wrap;gap:8px}
  .list-item .li-title{white-space:normal}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr}
  .row-3{grid-template-columns:1fr}
  body{font-size:14px}
}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:300;transition:transform .3s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <!-- 移动端顶栏 -->
  <div class="mobile-bar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="m-title">🐷 小猪嘟嘟</div>
    <div class="m-date" id="mDate"></div>
  </div>
  <div class="drawer-mask" id="drawerMask"></div>

  <!-- 左侧导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🐷</div>
      <div>
        <div class="title">甜呱工作台</div>
        <div class="subtitle">STARDREW HOME</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="todo"><span class="ico">📝</span>待办清单</button>
      <button class="nav-item" data-page="finance"><span class="ico">🐷</span>存钱罐罐</button>
      <button class="nav-item" data-page="fit"><span class="ico">🏃</span>减脂记录</button>
      <button class="nav-item" data-page="schedule"><span class="ico">📅</span>日程月历</button>
      <button class="nav-item" data-page="anniv"><span class="ico">🌸</span>纪念日生日</button>
      <button class="nav-item" data-page="learn"><span class="ico">🎓</span>学习记录</button>
      <button class="nav-item" data-page="period"><span class="ico">🌺</span>经期记录</button>
      <button class="nav-item" data-page="study"><span class="ico">📚</span>阅读口语</button>
      <button class="nav-item" data-page="podcast"><span class="ico">🎧</span>播客小宇宙</button>
      <button class="nav-item" data-page="settings"><span class="ico">⚙️</span>设置</button>
    </nav>
    <div class="nav-foot">🐷 小猪嘟嘟 · v1.0<br>💗 本地存储 · 隐私安全</div>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="main"></main>
</div>

<!-- 模态框容器 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head"><h3 id="modalTitle">标题</h3><button class="icon-btn" style="background:rgba(255,255,255,.3);border-color:transparent;color:#fff" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   甜呱工作台 - 主脚本
   ============================================================ */

/* ---------- 工具函数 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);
const nowStr = () => new Date().toISOString().slice(0,16);
const fmtDate = d => { if(!d) return ''; const x=new Date(d); return `${x.getMonth()+1}月${x.getDate()}日`;};
const fmtFull = d => { if(!d) return ''; const x=new Date(d); return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`;};
const fmtDateTime = d => { if(!d) return ''; const x=new Date(d); return `${x.getMonth()+1}月${x.getDate()}日 ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`;};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 存储层 ---------- */
const DB = {
  get(key, def){ try{ const v=localStorage.getItem('tg_'+key); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(key, val){ localStorage.setItem('tg_'+key, JSON.stringify(val)); },
  del(key){ localStorage.removeItem('tg_'+key); }
};

/* ---------- 农历转换 (1900-2100) ---------- */

const LUNAR_MONTH=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAY=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunarYearDays(y){ let s=348; for(let i=0x8000;i>0x8;i>>=1) s+=(LUNAR_DATA[y-1900]&i)?1:0; return s+leapDays(y); }
function leapMonth(y){ return LUNAR_DATA[y-1900]&0xf; }
function leapDays(y){ return leapMonth(y)?((LUNAR_DATA[y-1900]&0x10000)?30:29):0; }
function monthDays(y,m){ return (LUNAR_DATA[y-1900]&(0x10000>>m))?30:29; }
function solar2lunar(date){
  let offset=Math.floor((date - new Date(1900,0,31))/86400000);
  let y=1900, temp=0;
  for(; y<2101 && offset>0; y++){ temp=lunarYearDays(y); offset-=temp; }
  if(offset<0){ offset+=temp; y--; }
  let leap=leapMonth(y), isLeap=false, m=1;
  for(; m<13 && offset>0; m++){
    if(leap>0 && m===leap+1 && !isLeap){ m--; isLeap=true; temp=leapDays(y); }
    else{ temp=monthDays(y,m); }
    if(isLeap && m===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && m===leap+1){ if(isLeap) isLeap=false; else{ isLeap=true; m--; } }
  if(offset<0){ offset+=temp; m--; }
  return { year:y, month:m, day:offset+1, monthStr:(isLeap?'闰':'')+LUNAR_MONTH[m-1]+'月', dayStr:LUNAR_DAY[offset], isLeap };
}
function lunar2solar(ly, lm, ld, isLeap){
  let offset=0;
  for(let i=1900;i<ly;i++) offset+=lunarYearDays(i);
  let leap=leapMonth(ly);
  for(let m=1;m<lm;m++){ offset+=monthDays(ly,m); if(m===leap) offset+=leapDays(ly); }
  if(isLeap) offset+=monthDays(ly,lm);
  offset+=ld-1;
  return new Date(1900,0,31+Math.floor(offset));
}
function lunarNextSolar(ly, lm, ld, isLeap, toYear){
  // 计算某农历日期在 toYear 年对应的公历日期
  try{ return lunar2solar(toYear, lm, ld, isLeap && leapMonth(toYear)===lm); }catch(e){ return null; }
}

/* ---------- 月历组件（可复用） ---------- */
function buildCalendar(year, month, marks, onPick, selectedDate){
  // marks: { 'YYYY-MM-DD': [{type:'schedule'}, {type:'period'}] }
  const first=new Date(year, month, 1);
  const startDow=first.getDay();
  const daysInMonth=new Date(year, month+1, 0).getDate();
  const today=todayStr();
  const selStr = selectedDate ? selectedDate.slice(0,10) : null;
  let html=`<div class="cal-head"><button class="icon-btn" id="calPrev">‹</button><div class="ym">${year}年${month+1}月</div><button class="icon-btn" id="calNext">›</button></div>`;
  html+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=> html+=`<div class="cal-dow">${w}</div>`);
  for(let i=0;i<startDow;i++) html+='<div class="cal-day other"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds=new Date(year, month, d).toISOString().slice(0,10);
    const m=marks[ds]||[];
    let dotTypes=[];
    if(m.some(x=>x.type==='schedule')) dotTypes.push('dot-schedule');
    if(m.some(x=>x.type==='period')) dotTypes.push('dot-period');
    if(m.some(x=>x.type==='memo')) dotTypes.push('dot-memo');
    const cls=['cal-day'];
    if(ds===today) cls.push('today');
    if(ds===selStr) cls.push('sel');
    if(m.length) cls.push('has');
    let dots = dotTypes.slice(0,3).map(t=>`<span class="${t}" style="display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 1px"></span>`).join('');
    html+=`<div class="${cls.join(' ')}" data-date="${ds}">${d}${m.length?`<div class="dots">${dots}</div>`:''}</div>`;
  }
  html+='</div>';
  html+='<div class="legend"><span><i class="dot-schedule" style="background:var(--blue-d)"></i>日程</span><span><i class="dot-period" style="background:var(--pig-dark)"></i>经期</span><span><i class="dot-memo" style="background:var(--mint-d)"></i>纪念日</span></div>';
  return html;
}

  // 委托在调用方处理
}

      for(const date in groups){
        html+=`<div style="font-size:13px;color:var(--pig-dark);font-weight:700;margin:8px 0 4px">${fmtFull(date)}</div>`;
        groups[date].forEach(t=> html+=this.item(t));

      </div>
    </div>`;

    DB.set('todos',list); this.render();

/* ---------- 5. 纪念日 & 生日 ---------- */
Pages.anniv = {
  render(){
    const list=DB.get('anniv',[]);
    const today=new Date(); today.setHours(0,0,0,0);
    const items=list.map(a=>this.calc(a, today)).sort((a,b)=>a.days-b.days);
    let html=`<div class="page-head">
      <h2>🌸 纪念日 & 生日 <span class="sub">珍藏每个重要日子</span></h2>
      <button class="btn primary" onclick="Pages.anniv.add()">＋ 添加</button>
    </div>`;

    if(items.length===0){ html+=`<div class="card pink"><div class="empty"><span class="big">🎀</span>还没有纪念日，添加第一个重要日子吧～</div></div>`; }

    // 即将到来
    const upcoming=items.filter(x=>x.days>=0);
    const passed=items.filter(x=>x.days<0);
    if(upcoming.length){
      html+=`<div class="card yellow"><div class="section-title">⏳ 即将到来</div>`;
      upcoming.forEach(x=>html+=this.item(x,today));
      html+='</div>';
    }
    if(passed.length){
      html+=`<div class="card"><div class="section-title">📜 已过</div>`;
      passed.forEach(x=>html+=this.item(x,today));
      html+='</div>';
    }

    // 今日
    const todayItems=items.filter(x=>x.days===0);
    if(todayItems.length){
      html=`<div class="card pink" style="border:3px solid var(--pig-accent)">
        <div class="section-title">🎉 今天！</div>
        ${todayItems.map(x=>`<div style="text-align:center;padding:8px"><div style="font-size:36px">${x.type==='生日'?'🎂':'🎊'}</div><div style="font-size:18px;font-weight:800;color:var(--pig-dark)">${escapeHtml(x.name)}</div><div style="color:var(--ink-soft);font-size:13px">${x.type} · ${x.relation}</div></div>`).join('')}
      </div>` + html;
    }

    $('#main').innerHTML=html;
  },
  calc(a, today){
    const y=today.getFullYear();
    let nextDate;
    if(a.calendar==='lunar' && a.repeat){
      // 农历重复，找今年对应的公历
      const parts=a.date.split('-'); // 存储为农历 YYYY-M-D-isLeap
      const ly=parseInt(parts[0]), lm=parseInt(parts[1]), ld=parseInt(parts[2]), isLeap=parts[3]==='1';
      let tryY=y;
      nextDate=lunarNextSolar(tryY, lm, ld, isLeap, tryY);
      if(!nextDate || nextDate<today){ tryY=y+1; nextDate=lunarNextSolar(tryY, lm, ld, isLeap, tryY); }
      if(!nextDate) nextDate=new Date(a.date.replace(/-\d$/,''));
    } else if(a.repeat){
      nextDate=new Date(a.date); nextDate.setFullYear(y);
      if(nextDate<today) nextDate.setFullYear(y+1);
    } else {
      nextDate=new Date(a.date);
    }
    nextDate.setHours(0,0,0,0);
    const days=Math.round((nextDate-today)/86400000);
    let lunarStr='';
    if(a.calendar==='lunar'){ const parts=a.date.split('-'); const lm=parseInt(parts[1]), ld=parseInt(parts[2]); lunarStr=`农历${LUNAR_MONTH[lm-1]||''}月${LUNAR_DAY[ld-1]||(ld+'日')}`; }
    return {...a, nextDate, days, lunarStr};
  },
  item(x, today){
    let badge;
    if(x.days===0) badge=`<span class="count-badge count-today">🎉 就是今天</span>`;
    else if(x.days<=7) badge=`<span class="count-badge count-soon">还有 ${x.days} 天</span>`;
    else badge=`<span class="count-badge count-far">还有 ${x.days} 天</span>`;
    const ico=x.type==='生日'?'🎂':(x.relation==='自己'?'✨':'🎊');
    const dateStr = x.lunarStr ? `${x.lunarStr}（${fmtFull(x.nextDate)}）` : fmtFull(x.nextDate);
    return `<div class="list-item">
      <span style="font-size:24px">${ico}</span>
      <div style="flex:1">
        <div class="li-title">${escapeHtml(x.name)} <span style="font-size:11px;color:var(--ink-soft);font-weight:400">${x.type}·${x.relation}${x.calendar==='lunar'?'·农历':''}</span></div>
        <div class="li-sub">${x.days<0?'已过 ':'下次：'}${dateStr}</div>
      </div>
      ${badge}
      <div class="li-actions">
        <button class="icon-btn" onclick="Pages.anniv.edit('${x.id}')">✏️</button>
        <button class="icon-btn" onclick="Pages.anniv.del('${x.id}')">🗑️</button>
      </div></div>`;
  },
  add(){ this._form(); },
  edit(id){ const a=DB.get('anniv',[]).find(x=>x.id===id); if(a) this._form(a); },
  del(id){ if(!confirm('删除这条记录？')) return; DB.set('anniv',DB.get('anniv',[]).filter(x=>x.id!==id)); this.render(); toast('已删除'); },
  _form(a){
    const isEdit=!!a; a=a||{name:'',type:'生日',date:todayStr(),calendar:'solar',repeat:true,relation:'朋友',note:''};
    const rels=['自己','亲人','朋友','其他'];
    const types=['生日','纪念日'];
    const body=`
      <div class="field"><label>名称</label><input id="f_name" value="${escapeHtml(a.name)}" placeholder="比如：妈妈 / 相恋纪念日"></div>
      <div class="row-2">
        <div class="field"><label>类型</label>
          <div class="chip-group" id="typeGroup">${types.map(t=>`<button class="chip ${a.type===t?'on':''}" data-v="${t}">${t==='生日'?'🎂':'🎊'} ${t}</button>`).join('')}</div>
        </div>
        <div class="field"><label>关系</label>
          <div class="chip-group" id="relGroup">${rels.map(r=>`<button class="chip ${a.relation===r?'on':''}" data-v="${r}">${r}</button>`).join('')}</div>
        </div>
      </div>
      <div class="field"><label>历法</label>
        <div class="chip-group" id="calGroup">
          <button class="chip ${a.calendar==='solar'?'on':''}" data-v="solar">☀️ 公历</button>
          <button class="chip ${a.calendar==='lunar'?'on':''}" data-v="lunar">🌙 农历</button>
        </div></div>
      <div class="field" id="dateField"></div>
      <div class="field"><label>每年重复</label>
        <div class="chip-group" id="repGroup">
          <button class="chip ${a.repeat?'on':''}" data-v="1">🔁 每年</button>
          <button class="chip ${!a.repeat?'on':''}" data-v="0">1️⃣ 仅一次</button>
        </div></div>
      <div class="field"><label>备注</label><input id="f_note" value="${escapeHtml(a.note||'')}" placeholder="可选"></div>
    `;
    const foot=`<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="Pages.anniv._save('${a.id||''}')">${isEdit?'保存':'添加'}</button>`;
    openModal(isEdit?'编辑纪念日':'添加纪念日', body, foot);

    let type=a.type, rel=a.relation, cal=a.calendar, rep=a.repeat;
    // 农历日期存储格式：存公历日期输入框，但内部转农历。这里简化：农历时让用户选年月日下拉
    const renderDate=()=>{
      if(cal==='lunar'){
        const cur=a.date.split('-');
        const cy=cur[0]||new Date().getFullYear();
        const cm=parseInt(cur[1])||1;
        const cd=parseInt(cur[2])||1;
        const isLeap=cur[3]==='1';
        let yOpt=''; for(let i=new Date().getFullYear();i<=new Date().getFullYear()+5;i++) yOpt+=`<option value="${i}" ${i==cy?'selected':''}>${i}年</option>`;
        let mOpt=''; for(let i=1;i<=12;i++) mOpt+=`<option value="${i}" ${i==cm?'selected':''}>${['正','二','三','四','五','六','七','八','九','十','冬','腊'][i-1]}月</option>`;
        let dOpt=''; for(let i=1;i<=30;i++) dOpt+=`<option value="${i}" ${i==cd?'selected':''}>${i}日</option>`;
        $('#dateField').innerHTML=`<label>农历日期</label>
          <div class="row-3">
            <select id="f_ly">${yOpt}</select>
            <select id="f_lm">${mOpt}</select>
            <select id="f_ld">${dOpt}</select>
          </div>
          <label style="margin-top:8px"><input type="checkbox" id="f_leap" ${isLeap?'checked':''}> 闰月（一般不勾）</label>`;
      } else {
        $('#dateField').innerHTML=`<label>日期</label><input type="date" id="f_date" value="${a.calendar==='solar'?a.date:todayStr()}">`;
      }
    };
    renderDate();
    $$('#typeGroup .chip').forEach(c=>c.onclick=()=>{ type=c.dataset.v; $$('#typeGroup .chip').forEach(x=>x.classList.toggle('on',x===c)); });
    $$('#relGroup .chip').forEach(c=>c.onclick=()=>{ rel=c.dataset.v; $$('#relGroup .chip').forEach(x=>x.classList.toggle('on',x===c)); });
    $$('#calGroup .chip').forEach(c=>c.onclick=()=>{ cal=c.dataset.v; $$('#calGroup .chip').forEach(x=>x.classList.toggle('on',x===c)); renderDate(); });
    $$('#repGroup .chip').forEach(c=>c.onclick=()=>{ rep=c.dataset.v==='1'; $$('#repGroup .chip').forEach(x=>x.classList.toggle('on',x===c)); });
    this._cur={type,rel,cal,rep};
  },
  _save(id){
    const name=$('#f_name').value.trim();
    if(!name){ toast('请输入名称'); return; }
    const {type,rel,cal,rep}=this._cur;
    let date;
    if(cal==='lunar'){
      const ly=$('#f_ly').value, lm=$('#f_lm').value, ld=$('#f_ld').value, isLeap=$('#f_leap').checked;
      date=`${ly}-${lm}-${ld}-${isLeap?1:0}`;
    } else {
      date=$('#f_date').value;
      if(!date){ toast('请选择日期'); return; }
    }
    const data={name,type,date,calendar:cal,repeat:rep,relation:rel,note:$('#f_note').value.trim()};
    const list=DB.get('anniv',[]);
    if(id){ const a=list.find(x=>x.id===id); Object.assign(a,data); } else { list.push({id:uid(),...data,createdAt:Date.now()}); }
    DB.set('anniv',list); closeModal(); this.render(); toast('已保存');
  }
};

  /* 学习打卡 */
  clock(){
    const logs=DB.get('learn_clock',[]).sort((a,b)=>b.date.localeCompare(a.date));
    const streak=this._streak(logs);
    const today=todayStr();
    const todayLogs=logs.filter(l=>l.date===today);
    const todayMin=todayLogs.reduce((s,l)=>s+(l.duration||0),0);
    const week=logs.filter(l=>{ const d=new Date(l.date); const w=new Date(); w.setDate(w.getDate()-7); return d>=w; });
    const weekMin=week.reduce((s,l)=>s+(l.duration||0),0);
    let html=`<div class="stat-grid">
      <div class="stat-card expense"><div class="label">🔥 连续打卡</div><div class="num">${streak}天</div></div>
      <div class="stat-card income"><div class="label">今日学习</div><div class="num">${todayMin}分</div></div>
      <div class="stat-card balance"><div class="label">本周累计</div><div class="num">${Math.round(weekMin/60*10)/10}h</div></div>
    </div>`;
    html+=`<button class="btn primary block" onclick="Pages.learn.addClock()" style="margin-bottom:14px">＋ 记录学习打卡</button>`;
    if(logs.length===0) html+=`<div class="card"><div class="empty"><span class="big">⏱️</span>还没有打卡记录，开始第一次学习打卡吧～</div></div>`;
    // 按日期分组
    const byDate={};
    logs.forEach(l=>{ (byDate[l.date]=byDate[l.date]||[]).push(l); });
    Object.keys(byDate).slice(0,14).forEach(d=>{
      const arr=byDate[d];
      const min=arr.reduce((s,l)=>s+(l.duration||0),0);
      html+=`<div class="card yellow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>${fmtFull(d)}</b><span style="font-size:12px;color:var(--ink-soft)">共 ${min} 分钟</span></div>`;
      arr.forEach(l=>{
        html+=`<div class="list-item">
          <span style="font-size:18px">${l.subject?'📘':''}</span>
          <div style="flex:1">
            <div class="li-title">${escapeHtml(l.subject||'学习')} · ${l.duration||0}分钟</div>
            <div class="li-sub">${l.startTime||''} ${l.note?'· '+escapeHtml(l.note):''}</div>
          </div>
          <div class="li-actions">
            <button class="icon-btn" onclick="Pages.learn.editClock('${l.id}')">✏️</button>
            <button class="icon-btn" onclick="Pages.learn.delClock('${l.id}')">🗑️</button>
          </div></div>`;
      });
      html+='</div>';
    });
    return html;

  _streak(logs){
    if(logs.length===0) return 0;
    const set=new Set(logs.map(l=>l.date));
    let n=0; let d=new Date();
    // 如果今天没打卡，允许从昨天开始算
    if(!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
    while(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
    return n;
  },

/* ---------- 7. 经期记录 ---------- */
Pages.period = {
  render(){
    const list=DB.get('period',[]).sort((a,b)=>b.startDate.localeCompare(a.startDate));

      <h2>🌺 经期记录 <span class="sub">关爱自己每一天</span></h2>

    </div>`;

    // 预测
    if(list.length>=1){
      const last=list[0];
      const avgCycle=this.avgCycle(list);
      const nextStart=new Date(last.startDate); nextStart.setDate(nextStart.getDate()+avgCycle);
      const days=Math.round((nextStart-new Date(todayStr()))/86400000);
      html+=`<div class="card pink"><div class="section-title">🔮 下次预测</div>
        <div style="text-align:center;padding:8px">
          <div style="font-size:13px;color:var(--ink-soft)">预计下次经期</div>

          <div style="margin-top:4px">${days>0?`<span class="count-badge count-soon">还有 ${days} 天</span>`:`<span class="count-badge count-today">已到/已过</span>`}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">平均周期 ${avgCycle}天</div>
        </div></div>`;
    }

    // 月历标记
    const y=Pages.schedule.curDate.getFullYear?Pages.schedule.curDate.getFullYear():new Date().getFullYear();
    // 用独立月历状态
    if(!this._cal) this._cal=new Date();
    const cy=this._cal.getFullYear(), cm=this._cal.getMonth();
    const marks={};
    list.forEach(p=>{
      let d=new Date(p.startDate), end=new Date(p.endDate||p.startDate);
      while(d<=end){ (marks[d.toISOString().slice(0,10)]=marks[d.toISOString().slice(0,10)]||[]).push({type:'period'}); d.setDate(d.getDate()+1); }
    });
    html+=`<div id="calWrap">${buildCalendar(cy,cm,marks)}</div>`;

    // 列表
    html+=`<div class="card"><div class="section-title">📋 历史记录</div>`;
    if(list.length===0) html+='<div class="empty"><span class="big">🌷</span>还没有记录，开始记录第一次吧～</div>';
    list.forEach((p,i)=>{
      const len=p.endDate?Math.round((new Date(p.endDate)-new Date(p.startDate))/86400000)+1:1;
      const cycle = i<list.length-1 ? Math.round((new Date(p.startDate)-new Date(list[i+1].startDate))/86400000) : null;
      html+=`<div class="list-item">
        <span style="font-size:20px">${p.flow==='多'?'🔴':p.flow==='中'?'🟠':'🟡'}</span>
        <div style="flex:1">
          <div class="li-title">${fmtFull(p.startDate)} ${p.endDate?'→ '+fmtDate(p.endDate):''}</div>
          <div class="li-sub">流量：${p.flow||'中'} · ${len}天 ${cycle?'· 周期'+cycle+'天':''} ${p.symptoms&&p.symptoms.length?'· '+p.symptoms.join('/'):''}</div>

        </div>
        <div class="li-actions">
          <button class="icon-btn" onclick="Pages.period.edit('${p.id}')">✏️</button>
          <button class="icon-btn" onclick="Pages.period.del('${p.id}')">🗑️</button>
        </div></div>`;
    });
    html+='</div>';

    $('#main').innerHTML=html;
    $('#calPrev').onclick=()=>{ this._cal=new Date(cy,cm-1,1); this.render(); };
    $('#calNext').onclick=()=>{ this._cal=new Date(cy,cm+1,1); this.render(); };
  },
  avgCycle(list){
    if(list.length<2) return 28;
    const sorted=[...list].sort((a,b)=>a.startDate.localeCompare(b.startDate));
    let gaps=[];
    for(let i=1;i<sorted.length;i++) gaps.push(Math.round((new Date(sorted[i].startDate)-new Date(sorted[i-1].startDate))/86400000));
    return Math.round(gaps.reduce((s,x)=>s+x,0)/gaps.length);
  },

};

    html+=`<div class="card"><div class="section-title">📋 记录列表</div>`;
    [...list].reverse().forEach(w=>{
      html+=`<div class="list-item">

          <div class="li-title">${fmtFull(w.date)}</div>

        </div>

  _drawChart(list){
    const c=$('#wChart'); if(!c) return;
    const dpr=window.devicePixelRatio||1;
    const w=c.offsetWidth, h=200;
    c.width=w*dpr; c.height=h*dpr; c.getContext('2d').scale(dpr,dpr);
    const ctx=c.getContext('2d');
    const weights=list.map(x=>parseFloat(x.weight)).filter(x=>!isNaN(x));
    if(weights.length<2) return;
    const min=Math.min(...weights)-1, max=Math.max(...weights)+1;
    const pad=30;
    ctx.clearRect(0,0,w,h);
    // 网格
    ctx.strokeStyle='#FFE4EC'; ctx.lineWidth=1;
    for(let i=0;i<=4;i++){ const y=pad+(h-pad*2)*i/4; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
    // 折线
    ctx.strokeStyle='#F48FB1'; ctx.lineWidth=2.5; ctx.beginPath();
    list.forEach((d,i)=>{
      const x=pad+(w-pad*2)*i/(list.length-1);
      const wt=parseFloat(d.weight); if(isNaN(wt)) return;
      const y=pad+(h-pad*2)*(1-(wt-min)/(max-min));
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // 点
    ctx.fillStyle='#EC407A';
    list.forEach((d,i)=>{
      const x=pad+(w-pad*2)*i/(list.length-1);
      const wt=parseFloat(d.weight); if(isNaN(wt)) return;
      const y=pad+(h-pad*2)*(1-(wt-min)/(max-min));
      ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    });
    // 标签
    ctx.fillStyle='#8D6E63'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    list.forEach((d,i)=>{
      if(i%Math.ceil(list.length/6)===0 || i===list.length-1){
        const x=pad+(w-pad*2)*i/(list.length-1);
        ctx.fillText(`${parseInt(d.date.slice(5))}`,x,h-8);
      }
    });
    ctx.textAlign='right';
    ctx.fillText(max.toFixed(1),pad-4,pad+4);
    ctx.fillText(min.toFixed(1),pad-4,h-pad);
  },

  _dietForm(d){

    DB.set('fit_diet',list); closeModal(); this.render(); toast('已保存');
  },
  /* 照片上传 + AI 识别 */
  _bindPhoto(inputId,upId,prevId,aiId,mode){
    const inp=$('#'+inputId), up=$('#'+upId), prev=$('#'+prevId), ai=$('#'+aiId);
    up.onclick=()=>inp.click();
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const reader=new FileReader();
      reader.onload=async()=>{
        prev.src=reader.result; prev.classList.remove('hidden'); up.classList.add('hidden');
        this._photo=reader.result;
        // AI 识别
        await this._aiRecognize(reader.result, ai, mode);
      };
      reader.readAsDataURL(f);
    };
    if(this._photo){ prev.src=this._photo; prev.classList.remove('hidden'); up.classList.add('hidden'); }
  },
  async _aiRecognize(base64, aiEl, mode){
    const cfg=DB.get('ai_config',{});
    if(!cfg.key){
      aiEl.innerHTML=`<div class="ai-badge">⚠️ 未配置AI</div><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">前往「设置」配置多模态API Key后可自动识别。当前请手动填写。</div>`;
      return;
    }
    aiEl.innerHTML=`<div class="ai-loading"><span class="ai-badge">🤖 AI识别中</span> 正在分析${mode==='diet'?'食物热量':'运动'}...</div>`;
    try{
      const base64Data=base64.split(',')[1];
      const prompt = mode==='diet'
        ? '请分析这张食物照片，返回JSON格式：{"food":"食物名称","calories":估算总卡路里数字,"portion":"份量描述"}。只返回JSON。'
        : '请分析这张运动/健身照片，返回JSON格式：{"type":"运动类型","duration":预估时长分钟数字,"calories":预估消耗卡路里数字,"intensity":"低/中/高"}。只返回JSON。';
      const res=await fetch(cfg.url||'https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({
          model: cfg.model||'gpt-4o-mini',
          messages:[{role:'user',content:[
            {type:'text',text:prompt},
            {type:'image_url',image_url:{url:base64}}
          ]}],
          max_tokens:300
        })
      });
      const data=await res.json();
      if(data.error) throw new Error(data.error.message||'API错误');
      const txt=data.choices[0].message.content;
      const m=txt.match(/\{[\s\S]*\}/);
      if(m){
        const obj=JSON.parse(m[0]);
        // 填入表单
        if(mode==='diet'){
          if(obj.food) $('#f_food').value=obj.food;
          if(obj.calories) $('#f_cal').value=obj.calories;
          if(obj.portion) $('#f_portion').value=obj.portion;
        } else {
          if(obj.type){ const sel=$('#f_type'); for(const opt of sel.options){ if(opt.text.includes(obj.type)||obj.type.includes(opt.text)){ opt.selected=true; break; } } }
          if(obj.duration) $('#f_dur').value=obj.duration;
          if(obj.calories) $('#f_cal').value=obj.calories;
          if(obj.intensity){ $$('#intGroup .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===obj.intensity)); this._curInt=obj.intensity; }
        }
        aiEl.innerHTML=`<div class="ai-badge">✅ AI识别完成</div><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">已自动填入，请核对后保存</div>`;
      } else throw new Error('未识别到结果');
    }catch(e){
      aiEl.innerHTML=`<div class="ai-badge">❌ 识别失败</div><div style="font-size:12px;color:#E53935;margin-top:4px">${escapeHtml(e.message)}。请手动填写。</div>`;
    }
  }

  _renderBookRows(){

      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <input placeholder="书名" value="${escapeHtml(b.title)}" oninput="Pages.study._books[${i}].title=this.value" style="flex:1">

  speak(){
    const logs=DB.get('study_speak',[]).sort((a,b)=>b.date.localeCompare(a.date));
    // 连续打卡
    const streak=this._streak(logs);
    const week=logs.filter(l=>{ const d=new Date(l.date); const w=new Date(); w.setDate(w.getDate()-7); return d>=w; });
    const enWeek=week.filter(l=>l.lang==='英语').length;
    const krWeek=week.filter(l=>l.lang==='韩语').length;
    let html=`<div class="stat-grid">
      <div class="stat-card expense"><div class="label">🔥 连续打卡</div><div class="num">${streak}天</div></div>
      <div class="stat-card income"><div class="label">本周英语</div><div class="num">${enWeek}次</div></div>
      <div class="stat-card balance"><div class="label">本周韩语</div><div class="num">${krWeek}次</div></div>
    </div>`;
    html+=`<div class="card mint"><div style="font-size:13px;color:var(--ink-soft);text-align:center">🦉 多邻国打卡：连续${streak}天！再接再厉～</div></div>`;

    if(logs.length===0) html+=`<div class="card"><div class="empty"><span class="big">🦜</span>还没有练习记录</div></div>`;
    logs.forEach(l=>{
      html+=`<div class="list-item">
        <span style="font-size:20px">${l.lang==='韩语'?'🇰🇷':'🇬🇧'}</span>

          ${l.note?`<div class="li-sub">${escapeHtml(l.note)}</div>`:''}
        </div>
        <div class="li-actions">
          <button class="icon-btn" onclick="Pages.study.editSpeak('${l.id}')">✏️</button>

        </div></div>`;
    });
    return html;
  },
  _streak(logs){
    if(logs.length===0) return 0;
    const set=new Set(logs.map(l=>l.date));
    let n=0; let d=new Date();
    while(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
    return n;
  },

  render(){
    const cfg=DB.get('ai_config',{});
    let html=`<div class="page-head"><h2>⚙️ 设置</h2></div>`;

    html+=`<div class="card purple"><div class="section-title">🤖 AI 视觉识别配置</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">配置多模态API Key后，饮食热量和运动记录可自动识别。兼容OpenAI格式（智谱/通义/OpenAI等）</div>
      <div class="field"><label>API 地址</label><input id="ai_url" value="${escapeHtml(cfg.url||'')}" placeholder="https://api.openai.com/v1/chat/completions"></div>
      <div class="field"><label>API Key</label><input id="ai_key" type="password" value="${escapeHtml(cfg.key||'')}" placeholder="sk-..."></div>
      <div class="field"><label>模型名</label><input id="ai_model" value="${escapeHtml(cfg.model||'')}" placeholder="gpt-4o-mini / glm-4v / qwen-vl-plus"></div>
      <button class="btn primary" onclick="Pages.settings.saveAi()">保存配置</button>
    </div>`;

    html+=`<div class="card yellow"><div class="section-title">💾 数据备份</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">数据存在本地浏览器，换设备会丢失。建议定期导出备份。</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="Pages.settings.exportData()">📤 导出全部数据</button>
        <button class="btn ghost" onclick="Pages.settings.importData()">📥 导入数据</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
      </div>
    </div>`;

    html+=`<div class="card"><div class="section-title">📱 添加到主屏幕</div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.8">
        <b>iPhone(Safari):</b> 点击底部分享按钮 → 添加到主屏幕<br>
        <b>Android(Chrome):</b> 右上角菜单 → 添加到主屏幕<br>
        添加后即可像App一样全屏打开，无浏览器地址栏。
      </div></div>`;

    html+=`<div class="card pink"><div class="section-title">⚠️ 危险操作</div>
      <button class="btn danger" onclick="Pages.settings.resetAll()">🗑️ 清空全部数据</button>
    </div>`;

    html+=`<div style="text-align:center;color:var(--ink-light);font-size:12px;padding:20px">🐷 小猪嘟嘟 · 用💗制作<br>可爱小猪 · 本地存储 · 隐私安全</div>`;

    $('#main').innerHTML=html;
    $('#importFile').onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const data=JSON.parse(r.result);
          Object.keys(data).forEach(k=>{ if(k.startsWith('tg_')) localStorage.setItem(k, JSON.stringify(data[k])); });
          toast('导入成功！刷新中...'); setTimeout(()=>location.reload(),800);
        }catch(err){ toast('导入失败：文件格式错误'); }
      };
      r.readAsText(f);
    };
  },
  saveAi(){
    DB.set('ai_config',{url:$('#ai_url').value.trim()||'https://api.openai.com/v1/chat/completions',key:$('#ai_key').value.trim(),model:$('#ai_model').value.trim()||'gpt-4o-mini'});
    toast('AI配置已保存');
  },
  exportData(){
    const data={};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('tg_')) data[k]=JSON.parse(localStorage.getItem(k)); }
    data._exportTime=new Date().toISOString();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`甜呱工作台备份_${todayStr()}.json`;
    a.click();
    toast('已导出');
  },
  importData(){ $('#importFile').click(); },
  resetAll(){
    if(!confirm('确定清空全部数据？此操作不可恢复！建议先导出备份。')) return;
    if(!confirm('再次确认：所有待办、记账、日程、学习等数据都将删除！')) return;
    for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k.startsWith('tg_')) localStorage.removeItem(k); }
    toast('已清空，刷新中...'); setTimeout(()=>location.reload(),800);
  }
};

/* ---------- 启动 ---------- */
go('todo');

</script>
</body>
</html>
